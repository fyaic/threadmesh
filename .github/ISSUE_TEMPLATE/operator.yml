name: First-run report (failures welcome)
description: Tell us the first useful result or the first step that failed.
title: "[Operator]: "
labels: [external-review, usability, triage]
body:
  - type: input
    id: environment
    attributes:
      label: Harness and operating system
      description: Include the harness version if known. Node version is only relevant for CLI or source-based use.
      placeholder: Codex desktop on macOS (do not include local paths)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Entry used
      options:
        - Codex marketplace plugin
        - Manual native Codex workflow
        - CLI example (installed package)
        - Local workspace or harness integration
        - Source checkout
        - Other or unsure
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time to first useful result, or where you stopped
      placeholder: 5 minutes, install failed, or tools loaded but the agent stayed silent
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What did you try, and what happened?
      description: Include the expected result and the first confusing or failed step. A failed or unknown outcome is useful feedback.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Receiver outcome, if a handoff was attempted
      options:
        - Not attempted
        - Sent, but receiver result unknown
        - Receiver acted, but result was incorrect or incomplete
        - Useful result checked
        - Failed or blocked before delivery
        - Other or unsure
    validations:
      required: false
  - type: textarea
    id: workflow
    attributes:
      label: Would you use it? (optional)
      description: Name a workflow, explain what you expected it to help with, or tell us why it was not useful.
    validations:
      required: false
  - type: checkboxes
    id: evidence
    attributes:
      label: Report context
      options:
        - label: I am independent of the ThreadMesh maintainer organization.
          required: false
        - label: I removed credentials, private transcripts, IDs, and local paths from this report.
          required: true
